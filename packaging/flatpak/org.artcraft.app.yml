app-id: org.artcraft.app
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cadcraft
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/cadcraft/cargo
modules:
  - name: cadcraft
    buildsystem: simple
    build-commands:
      - cargo build --release -p cadcraft
      - install -Dm755 target/release/cadcraft /app/bin/cadcraft
    sources:
      - type: dir
        path: .
